[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustlayer-sdk"
version = "0.1.0"
description = "Python SDK for TrustLayer observability and governance."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["trustlayer", "agents", "observability", "governance", "ai"]
authors = [
    { name = "TrustLayer Contributors" },
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/eljaplacido/trustlayer"
Repository = "https://github.com/eljaplacido/trustlayer"
Documentation = "https://github.com/eljaplacido/trustlayer/tree/main/spec/v0.1"
Issues = "https://github.com/eljaplacido/trustlayer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    # Required for the OTel exporter tests so CI exercises the extra
    # without making it a hard install requirement (ADR-012).
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
otel = [
    # Public OTel extra — what users install via `pip install
    # trustlayer-sdk[otel]`. Stays minimal so the dependency footprint
    # only grows when the integration is actually used.
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trustlayer"]

[tool.hatch.build.targets.sdist]
include = ["src/trustlayer", "README.md", "pyproject.toml", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["README.md"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/trustlayer"]
