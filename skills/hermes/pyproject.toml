# Local config for the Hermes subagent. Hermes is invoked in-process and is
# not published — installing trustlayer-sdk is enough to use it
# (`pip install -e sdks/python`). This file only configures pytest so the
# package and the SDK resolve from a clean checkout.
#
# `evaluators/src` joined that list in ADR-020: `LLMReflector` now speaks to
# Ollama through `trustlayer_eval.providers` rather than carrying its own copy
# of the wire format. Hermes is in-repo and unpublished, so an intra-repo
# import is a dependency on a sibling directory, not on a release.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "../../sdks/python/src", "../../evaluators/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["README.md"]

# Hermes was the one Python package with no typing gate, which meant the
# package ADR-020 refactors `LLMReflector` onto was also the package where a
# regression could not be caught. It already passed `--strict` with no
# findings, so this records the standard the code already meets rather than
# imposing a new one; `strict` matches the SDK and MCP server so no package is
# the soft one.
[tool.mypy]
python_version = "3.11"
strict = true
files = ["."]
exclude = ["^tests/"]
mypy_path = ["..", "../../sdks/python/src", "../../evaluators/src"]
