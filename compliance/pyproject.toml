[project]
name = "trustlayer-compliance"
version = "0.1.0"
description = "Compliance evidence, readiness, and audit tooling for TrustLayer."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "jsonschema>=4.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-jsonschema",
    "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["README.md"]
