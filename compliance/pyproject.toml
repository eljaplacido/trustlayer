[project]
name = "trustlayer-compliance"
version = "0.1.0"
description = "Compliance evidence, readiness, and audit tooling for TrustLayer."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "jsonschema>=4.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-jsonschema",
    "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

# Phase 8 engineering contract (docs/PHASE-8-DESIGN.md 5.2). Enabled package-
# wide rather than per-module: a typing gate that only new files honour drifts
# back the moment someone edits an old one.
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["README.md"]
