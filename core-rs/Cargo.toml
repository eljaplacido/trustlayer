[package]
name = "trustlayer-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "TrustLayer Rust core: AgentTraceEvent schema, CSL policy engine, cynepic-guardian."
readme = "README.md"
repository = "https://github.com/eljaplacido/trustlayer"
homepage = "https://github.com/eljaplacido/trustlayer"
documentation = "https://github.com/eljaplacido/trustlayer/tree/main/spec/v0.1"
keywords = ["trustlayer", "agent", "observability", "policy", "governance"]
categories = ["web-programming", "development-tools", "api-bindings"]

[lib]
name = "trustlayer_core"
path = "src/lib.rs"

[[bin]]
name = "trustlayer-guardian"
path = "src/bin/guardian.rs"
required-features = ["server"]

[features]
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:tower-http", "dep:subtle", "dep:notify", "dep:prometheus"]
# Durable, horizontally-scalable trace store backed by Postgres (ADR-015).
# Additive: enable alongside `server` -> `--features server,postgres`.
postgres = ["dep:sqlx", "dep:tokio"]
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
# Wait-free policy swap on the guardian hot path (ADR-009). Tiny, non-optional.
arc-swap = "1"
# Object-safe async trait for the pluggable `TraceStore` backends. Small.
async-trait = "0.1"
# SHA-256 for the Art. 12 tamper-evident event chain (ADR-017). Non-optional:
# integrity is a property of the store, not of the HTTP surface.
sha2 = "0.10"
axum = { version = "0.7", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "0.5", optional = true, features = ["cors"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
# Constant-time comparison for bearer-token auth (ADR-007). Optional so the
# library can still be used without the HTTP server pulled in.
subtle = { version = "2", optional = true, default-features = false }
# Filesystem watcher for policy hot-reload (ADR-009). Uses the OS-default
# backend (inotify / kqueue / FSEvents / ReadDirectoryChangesW).
notify = { version = "6", optional = true }
# Prometheus metrics (Slice 3). Text-format exposition only; no protobuf.
prometheus = { version = "0.13", optional = true, default-features = false }
# Python native extension via pyo3 (ADR-014). Buildable with maturin.
# Use `maturin develop` or `maturin build` to produce a wheel.
pyo3 = { version = "0.29", optional = true, default-features = false, features = ["extension-module", "macros"] }
# Postgres trace-store backend (ADR-015). Runtime query API only (no compile-
# time DATABASE_URL needed). rustls so no system OpenSSL dependency.
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
# Ed25519 signatures over chain checkpoints (ADR-017 §5). Non-optional
# because checkpointing is a property of the *store*, not of the HTTP surface:
# cfg-gating it behind `server` would give the same store two checkpoint
# formats depending on build flags, and a checkpoint whose shape depends on how
# the binary was compiled is not an audit artifact. `zeroize` wipes the seed
# from memory on drop; no `rand_core`, because this crate deliberately cannot
# generate keys (see `CheckpointSigner`).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
