name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Python SDK ──────────────────────────────────────────────────────
  python-sdk:
    name: "Python SDK (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: MyPy typecheck
        run: mypy src/trustlayer
      - name: Pytest
        run: pytest --tb=short -q

  # ── TypeScript SDK ──────────────────────────────────────────────────
  typescript-sdk:
    name: "TypeScript SDK (node${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --reporter=verbose

  # ── Hermes ──────────────────────────────────────────────────────────
  hermes:
    name: "Hermes (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: skills/hermes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python SDK (dependency)
        run: pip install -e ../../sdks/python[dev]
        working-directory: skills/hermes
      - name: Install Hermes test deps
        run: pip install pytest ruff
      - name: Ruff lint
        run: ruff check . --config pyproject.toml
      - name: Pytest
        run: pytest --tb=short -q

  # ── Rust core ───────────────────────────────────────────────────────
  rust-core:
    name: "Rust Core (build + test + lint + fmt)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --features server --all-targets -- -D warnings
      - name: Build
        run: cargo build --features server --release
      - name: Test
        run: cargo test --features server

  # ── MCP server ──────────────────────────────────────────────────────
  mcp-server:
    name: "MCP Server (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ../sdks/python[dev]
          pip install -e .[dev]
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: MyPy typecheck
        run: mypy src/trustlayer_mcp
      - name: Pytest
        run: PYTHONPATH=src:../sdks/python/src:../skills python -m pytest --tb=short -q

  # ── Go SDK ───────────────────────────────────────────────────────────
  go-sdk:
    name: "Go SDK (test + vet)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1 -race

  # ── Dashboard ───────────────────────────────────────────────────────
  dashboard:
    name: "Dashboard (node${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --reporter=verbose
      - name: Build
        run: npm run build

  compliance:
    name: "Compliance tooling (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: compliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e .[dev]
          pip install types-jsonschema types-PyYAML mypy
      - name: Ruff lint and formatting
        run: |
          ruff format --check src/ tests/
          ruff check src/ tests/
      - name: MyPy typecheck
        working-directory: .
        run: MYPYPATH=. mypy -p compliance.src
      - name: Pytest
        run: python -m pytest --tb=short -q

  security:
    name: "Dependency and secret hygiene"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tracked secrets
        run: |
          ! git grep -nEI '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|ghp_[A-Za-z0-9]{36})' -- . ':!docs/**' ':!CHANGELOG.md'
      - name: Audit Python release dependencies
        run: |
          pip install pip-audit
          pip-audit -r sdks/python/requirements-release.txt
          pip-audit -r mcp-server/requirements-release.txt
          pip-audit -r compliance/requirements-release.txt
      - name: Audit production Node dependencies
        run: |
          cd sdks/typescript && npm ci && npm audit --omit=dev --audit-level=high
          cd ../../dashboard && npm ci && npm audit --omit=dev --audit-level=high
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cd core-rs && cargo audit
